services:
  chatbot:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env            # supplies ANTHROPIC_API_KEY
    environment:
      - DB_PATH=/app/data/conversations.db
    volumes:
      - chatbot-data:/app/data   # survives `docker compose down`; image layer doesn't
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  chatbot-data:
