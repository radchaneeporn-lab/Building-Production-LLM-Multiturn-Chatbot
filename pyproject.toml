[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-multiturn-chatbot"
version = "0.1.0"
description = "Production-shaped agentic multi-turn chatbot, built up in learning steps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    # psycopg 3 (not psycopg2). [binary] ships prebuilt wheels so the image
    # needs no libpq/compiler; [pool] is the connection pool PostgresStore
    # opens at startup.
    "psycopg[binary,pool]>=3.1",
]

[tool.setuptools.packages.find]
include = ["src*"]
